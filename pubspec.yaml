
name: malam
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.2
  http: ^1.6.0
  skeletonizer: ^2.1.3
  intl: ^0.20.3
  internet_connection_checker_plus: ^3.1.1
  onesignal_flutter: ^5.6.7
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
# =========================
# NATIVE SPLASH CONFIG
# =========================

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/logo/logo.png
  android: true
  ios: true
  fullscreen: true

  android_12:
    image: assets/logo/logo.png
    icon_background_color: "#0A0A0A"

# =========================
# FLUTTER CONFIG
# =========================

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/
    - assets/icons/
    - assets/fonts/Cairo/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700

